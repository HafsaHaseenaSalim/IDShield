<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token() if csrf_token is defined else '' }}">
<title>{% block title %}IDShield{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
{# data-page drives which controller app.js runs. Dispatching from an
   attribute rather than an inline <script> is what lets the Content-Security
   -Policy forbid inline script entirely. #}
<body data-page="{% block page %}home{% endblock %}">
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <a class="brand" href="/" aria-label="IDShield home">
    <svg class="brand-mark" viewBox="0 0 32 36" aria-hidden="true" focusable="false">
      <path d="M16 2 29 7v9c0 8.3-5.2 14.6-13 18C8.2 30.6 3 24.3 3 16V7l13-5Z"></path>
      <path class="brand-check" d="m9.5 17 4.2 4.2 8.8-9"></path>
    </svg>
    <span>IDShield</span>
  </a>
  <nav aria-label="Main">
    <a href="/verify">Verification</a>
    {% if session.get('role') == 'employee' and session.get('analyst_authenticated') %}
      <a href="/simulator">Simulator</a>
      <a href="/dashboard">Analyst console</a>
    {% endif %}
  </nav>
</header>
<main class="container" id="main">
{% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
